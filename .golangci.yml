# Root configuration, inherited by every Go module in the repo.
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - errorlint
    - forbidigo
    - gocritic
    - goconst
    - misspell
    - nilerr
    - revive
    - unconvert
    - usetesting
  settings:
    depguard:
      rules:
        # The seam ADR 0018 draws. A gateway adapter is the only place that
        # knows a provider's name, wire vocabulary and status codes; everything
        # else reaches a bank through banking.Gateway. bankingtest is
        # deliberately not listed: it is a second implementation of the port and
        # is meant to be imported by the tests of anything that consumes one.
        gateway-adapters-stay-behind-the-port:
          list-mode: lax
          files:
            - "!**/apps/wimm/internal/banking/**"
          deny:
            - pkg: github.com/xuuid/wimm/apps/wimm/internal/banking/enablebanking
              desc: >-
                import internal/banking and depend on banking.Gateway; only
                code inside internal/banking may name a gateway adapter
    errcheck:
      # Writing to a terminal that has gone away is not a condition a command
      # can act on, and checking it at every call obscures the ones that matter.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    forbidigo:
      # Unstructured logging. Logs go through log/slog (.claude/rules/go.md).
      forbid:
        - pattern: ^fmt\.Print.*$
        - pattern: ^log\.(Print|Fatal|Panic).*$
        # Every lifetime in wimm is compared against database time (ADR 0016).
        # A skewed process clock must not be able to extend a link or a
        # session, and the way that stays true is by there being no process
        # clock to read.
        - pattern: ^time\.Now$
          msg: compute lifetimes in SQL with now(), not from the process clock
      exclude-godoc-examples: true
    revive:
      rules:
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      # A command's own stdout is its interface, not a log line.
      - path: cmd/wimmctl/
        linters: [forbidigo]
      # Tests read the clock to measure themselves, which is not a lifetime.
      - path: _test\.go
        linters: [forbidigo]
      # The gateway adapter signs every request with a JWT, and iat/exp are
      # values the remote API requires rather than lifetimes wimm compares
      # anything against. The ban exists so a skewed clock cannot silently
      # extend a session or a link; a skewed clock here makes the gateway
      # reject the token and the request fail loudly, which is the opposite
      # failure. The clock is injectable, and this is the only package allowed
      # to reach for the default.
      - path: internal/banking/enablebanking/
        linters: [forbidigo]
      # A repeated literal in a fixture is the fixture being readable, not a
      # constant waiting to be extracted.
      - path: (_test\.go|test/)
        linters: [goconst]

formatters:
  enable:
    - gofmt
