name: wimm
version: 1
description: wimm workflow - proposal → stories → specs → design → canvas → tasks. Stories carry the user and the value; specs carry the contract; the canvas is drawn before any task is written.
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<capability-path>/spec.md`. Use kebab-case for path segments you introduce (e.g., `user-auth` or `identity/user-auth`) and follow the project's existing spec organization.
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Use the exact existing path under `openspec/specs/`. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Research existing specs before filling this in:
      run `openspec list --specs` for the project's capability inventory, then
      `openspec show "<spec-id>" --type spec --json --no-scenarios` for any that
      look related - that returns a capability's purpose and requirement texts
      without pulling whole spec files into context. Append `--store "<id>"` to
      both commands only for a registered standalone store, and keep `--type
      spec`: a change and a spec sharing a name is otherwise an ambiguous-item
      error. `openspec list` without `--specs` lists in-flight changes, not
      specs - it never shows what the project already covers. Reuse an existing
      capability's exact path instead of introducing a near-duplicate name.
      The filtered read is only an overview. Before deciding what is already
      covered or what should change, read each relevant spec in full, including
      scenarios, with `openspec show "<spec-id>" --type spec` (same `--store` rule).
      Each capability listed here will need a corresponding spec file.

      Every change must either declare at least one capability (new or
      modified) or explicitly opt out of specs: `openspec validate` rejects a
      change with zero deltas unless the change's `.openspec.yaml` sets
      `skip_specs: true`. Use `skip_specs: true` only when no spec-level
      behavior changes (pure refactor, tooling, docs) - specs describe
      behavior, so if behavior does not change, no spec should change either.
      Do not invent a requirement just to satisfy validation.

      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.

      This is the foundation - specs, design, and tasks all build on this.
    requires: []

  - id: stories
    generates: stories.md
    description: INVEST user stories with user-testable acceptance criteria
    template: stories.md
    instruction: |
      Write the change as user stories before deciding what the system must do.

      A story states a real user, a capability, and the value delivered. The
      spec that follows states what the system SHALL do. Both are needed and
      neither replaces the other: a requirement without a story is work nobody
      asked for, and a story without a requirement is a wish.

      Create this artifact only if the change delivers something a person can
      use. Tooling, refactors, dependency bumps and internal migrations record a
      deliberate skip in one line - inventing a story for them produces the
      "As a developer I want..." shape, which is the tell that there is no user.

      **Name the user, never "the user".** Who they are decides what the value
      is. If the change serves more than one kind of person, that is usually
      more than one story.

      **A story states who and why; the spec states what.** Do not write
      acceptance criteria here. A scenario in the spec is an acceptance
      criterion, and writing the behaviour in both places gives you two versions
      of it that drift - the one that drifts is always the one nobody runs.
      Under Satisfied by, name the requirements that deliver the story once the
      specs exist.

      **Apply INVEST honestly and record the answer.** The six lines are a
      self-check, not a ritual:

      - Independent - can this ship without another story in the same change?
      - Negotiable - does it state the need rather than dictate a solution?
      - Valuable - can you name what the user can now do that they could not?
      - Estimable - is it understood well enough to size?
      - Small - one story, or several wearing one title?
      - Testable - do the requirements under Satisfied by actually prove it?

      A story that fails one of these is not automatically wrong. Say which,
      say why it is accepted, and move on. A page of six green ticks that nobody
      thought about is worth less than one honest "Small - no, this covers three
      screens; splitting them would ship a half-usable ledger".

      **Each story names its capabilities**, matching the proposal's Capabilities
      section. Every requirement written in the specs carries a `**Story**:` line
      pointing back here; if one does not, either the story is missing or the
      requirement is.

      Number stories S1, S2, ... The canvas and tasks refer to them by number.
    requires:
      - proposal

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      A spec is a behavior contract, not an implementation plan.

      Good spec content:
      - Observable behavior users or downstream systems rely on
      - Inputs, outputs, and error conditions
      - External constraints (security, privacy, reliability, compatibility)
      - Scenarios that can be tested or explicitly validated

      Avoid in specs:
      - Internal class/function names
      - Library or framework choices
      - Step-by-step implementation details
      - Detailed execution plans (those belong in design.md or tasks.md)

      Quick test: if the implementation can change without changing externally
      visible behavior, it likely does not belong in the spec.

      **The scenarios here are the acceptance criteria.** There is no second list
      anywhere; stories.md carries the user and the value, and this file carries
      the behaviour that proves it.

      So a scenario for a user-facing capability must be observable by a person,
      not only by a test. Write what someone sees, does, or is told. A scenario
      naming a function, a table, an endpoint, a component or a token is an
      implementation note and belongs in design.md or tasks.md.

      Cover the unhappy path the user can actually reach: the empty case, the one
      they get wrong, the one that fails on them. Requirements with only a happy
      path ship a screen that breaks the first time reality touches it.

      **Every requirement carries a `**Story**: S<n>` line** directly under its
      header, matching stories.md. If a requirement has no story, either the
      story is missing or the requirement is - resolve that before writing it.

      **Repeat that line when writing a MODIFIED requirement.** A MODIFIED block
      replaces the whole existing block. A dropped scenario is caught as an
      error; a dropped `**Story**:` line is not caught at all.

      Create one spec file per capability listed in the proposal's Capabilities section.
      `<capability-path>` is the spec directory relative to `specs/` (for example,
      `user-auth` or `identity/user-auth`). Preserve the full path:
      - New capabilities: use the exact path from the proposal at `specs/<capability-path>/spec.md`. Any path segment newly introduced in the proposal must be kebab-case. Follow the project's existing organization; do not add a new domain level when the project uses a flat layout.
      - Modified capabilities: use the exact existing path from `openspec/specs/<capability-path>/` when creating the delta at `specs/<capability-path>/spec.md`. Run `openspec list --specs` to confirm that path before writing the delta, appending `--store "<id>"` only for a registered standalone store - a mistyped or invented path targets a capability that does not exist rather than the one you meant. Do not move or rename the capability.

      There must be at least one spec file unless the change's `.openspec.yaml`
      sets `skip_specs: true` (no spec-level behavior change) - `openspec validate`
      rejects a zero-delta change without that marker. If the proposal lists no
      capabilities and `skip_specs` is not set, revisit the proposal first.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.

      New capabilities only: start the delta spec with a `## Purpose` section -
      one or two sentences (50+ characters, or `openspec validate --strict`
      reports it as too brief) describing what the capability is for. Archive
      copies it into the main spec it creates; without it the new main spec is
      left with a `TBD ... Update Purpose after archive` placeholder to fill in
      by hand. Do NOT add `## Purpose` to a delta for an existing capability -
      that spec already has one and the delta's is ignored. To change an
      existing capability's Purpose - including a leftover `TBD` placeholder -
      edit `<planningHome.root>/openspec/specs/<capability-path>/spec.md`
      directly. `planningHome.root` comes from the `openspec instructions ...
      --json` response. Always use it rather than a repo-relative path: it
      resolves to the store whenever the change lives in one - whether that
      came from `--store`, a project `store:` pointer, or a global default
      store - and to the current repository otherwise. Do not try to work out
      which case applies; the field already has.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in `<planningHome.root>/openspec/specs/<capability-path>/spec.md` (the same store-aware root as above)
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Example (a new capability, so it opens with `## Purpose`):
      ```
      ## Purpose

      Lets users take their data out of the product in a portable format.

      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export
      - **WHEN** user clicks "Export" button
      - **THEN** system downloads a CSV file with all user data

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal
      - stories

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change.

      When to include design.md (create only if any apply):
      - Cross-cutting change (multiple services/modules) or new architectural pattern
      - New external dependency or significant data model changes
      - Security, performance, or migration complexity
      - Ambiguity that benefits from technical decisions before coding

      Sections:
      - **Context**: Only the current state and constraints needed to explain the approach. Reference the proposal for motivation instead of restating it (e.g., "See proposal.md - Why").
      - **Language**: The nouns this change introduces or settles. One line each: the word, what it names, and what it is never called. Omit the section only if the change introduces no new domain vocabulary.
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes. Don't restate the proposal's scope - add only design-level boundaries.
      - **Decisions**: Key technical choices with rationale (why X over Y?). Include alternatives considered for each decision.
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] → Mitigation
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)
      - **Open Questions**: Unknowns that can safely be answered later without
        changing the specs, the approach, or the task breakdown. Omit if none.

      Open questions are for genuinely deferrable unknowns, not decisions you
      skipped. If a question would change the specs, the chosen approach, or
      the task breakdown, resolve it now - ask the user instead of guessing.

      Focus on architecture and approach, not line-by-line implementation.
      The proposal covers why and what; design covers how. Reference the
      proposal for motivation and, once written, the specs for requirements -
      if a section would only restate them, point to them instead.

      **The Language section is binding, not descriptive.** The specs, the
      interface copy and the code identifiers use the same nouns for the same
      things. A design that names a thing here and a screen that calls it
      something else have already forked the model, and nothing downstream
      catches it. Where the code wants a different word, that is a signal the
      model is wrong rather than that the code needs a synonym - say so here and
      pick one word.

      Good design docs explain the "why" behind technical decisions.
    requires:
      - proposal

  - id: canvas
    generates: canvas.md
    description: The journey drawn on the pen.dev canvas, and the record of what was drawn
    template: canvas.md
    instruction: |
      Draw or update the change on the pen.dev canvas, then record what was
      drawn. The canvas is where this project decides what a screen is; the
      proposal is not finished until the design exists.

      Create this artifact only if the change alters something a person sees or
      operates: a screen, a flow, a task surface, a state, or a component's
      appearance or behaviour. A change with no user-facing surface - a worker,
      a migration, a build script, a dependency bump - records a deliberate skip
      instead. Say so in one line rather than creating an empty canvas.md.

      Read `.claude/skills/pen-design/SKILL.md` before the first pencil call,
      and `references/tooling-traps.md` before the first `execute`. They are
      binding, not background.

      Two files, two owners. Journey flow - routes, content, decisions, states -
      goes in a journey `.pen` under `apps/web/design/`, one file per journey
      family or product area - a journey is the app's flow and the app owns it.
      Reusable mechanics go in `packages/ui/design/product-ui.lib.pen`. Never add
      journey frames to the library. If the journey file does not exist yet, create it with the zoning
      the skill sets out (00 overview, 10 primary success, 20 alternative paths,
      30 state index, 40 theme and accessibility QA, 90 notes).

      Draw with `just pen-exec <journey.pen>`, which pipes the snippet into a
      headless `pen interactive` that really opens the file. The pencil MCP
      ignores its filePath and edits whatever Pen.app has open, so an MCP call
      aimed at a journey silently edits the library instead.

      Bind the library before drawing: `just pen-import apps/web/design/<journey>.pen
      ui packages/ui/design/product-ui.lib.pen`. It creates the journey file if it
      does not exist and writes the `imports` key, which no MCP or CLI call can
      write. Everything in the library is then addressed through the alias -
      `ref: "ui:W2gOKx"` for a component, `"$ui:color-bg-canvas"` for a token.
      The colon is load-bearing: a bare id does not resolve and a slash is
      rejected. A node you draw yourself must alias-qualify every token or it
      falls back to black without complaining.

      **Interface copy carries no em dashes and no marketing voice.** No em or en
      dash anywhere a person reads in the product; use a full stop or a comma and
      write the shorter sentence. No "seamless", "effortless", "elevate", "unlock
      the power", "dive in", "robust". A screen reads like a person wrote it for
      one other person, or it reads like filler. This applies to the drawn copy
      too: a canvas is where the words are decided, and copy nobody edited on the
      canvas is copy nobody edits later.

      **Draw what exists now, never what is planned.** The canvas describes the
      product as it will be after this change ships and nothing further. A shell
      carrying navigation to screens that do not exist, an empty state promising a
      feature, a tab strip for one tab - each draws a product nobody agreed to
      build, and someone has to unbuild it later having assumed the drawing was a
      decision. The pull is strongest where the library already has a richer
      component, because instancing the full app shell is less work than drawing
      the one header that exists today. Take the extra work: if the journey needs
      less than the library offers, it needs a smaller component, and that is a
      finding worth recording under Components missing.

      **The library is additive.** Never rename, retype, reparent or delete a
      node that already exists as a side effect of adding one - not to make a
      name read better beside your addition, not to make siblings symmetrical.
      A `.pen` is pretty-printed JSON, so read it with `jq` when you want its
      shape, and it does diff - but a three-thousand-node diff buries a one-line
      rename. `just pen-manifest verify` fails on any such change; `just pen-manifest write`
      is for when changing an existing node is the thing you set out to do.
      Read the component you are extending and copy its own pattern rather than
      one inferred from another zone.

      Compose from library components. Instance what exists; do not redraw a
      control's chrome. Anything the journey needs that the library lacks goes
      under Components missing and becomes a task - build it in the library
      during apply, not here.

      **Every entry under Components missing is three deliverables, not two:**
      the origin in `product-ui.lib.pen`, the Svelte component in
      `packages/ui/src/<layer>/`, and its `.stories.svelte` beside it. A
      component with no story is a component nobody can see in isolation, in
      either theme, at any viewport, and its behavioural contract - focus, live
      regions, disabled states - is asserted nowhere. Name all three in the
      task, so none of them is remembered rather than planned. `.claude/skills/
      storybook/SKILL.md` gives the layer, the title and the play functions;
      `just check packages/ui` refuses a component that has no story.

      **Layers are atomic design and the story title mirrors them.**
      `atoms/ molecules/ organisms/ templates/ pages/` under `packages/ui/src/`,
      matching the library's own zoning. A template and a page are components:
      they get stories like anything else.

      **Before declaring anything missing, find where the library already puts
      that content.** Search by the data, not by the shape you have in mind: ask
      "where does this design system show a signed-in person?", not "is there a
      top bar?". A component list gives names and ids and tells you nothing about
      what a component contains, so open the two or three that could plausibly own
      it and read their children. This is how a duplicate gets built: you picture
      a shape, fail to find that shape, and add it - while the system was holding
      the same content somewhere else, and now two components own one job.

      Every entry under Components missing names the existing components that were
      opened and read, and why each cannot carry it. An entry without that line is
      not a finding, it is a guess.

      Draw every state the stories' acceptance criteria name, including the
      unhappy ones. A criterion nobody can see on the canvas is a screen that
      does not exist yet.

      Assign the journey ID before drawing. IDs are stable and never reused:
      check the existing journey files and every archived canvas.md before
      taking one.

      Mutate in one `pen-exec` call and verify in a separate one - bounds,
      `ctx.problems` and screenshots all return the pre-layout frame inside the
      call that changed it. To look at what you drew, `Export` the frame to PNG
      and read the file. Every number written into Contracts for implementation
      must have been measured, not recalled.

      `pen-exec` saves, and refuses to write anything if the snippet errored, so
      a clean run is on disk. Confirm `git status` shows the file before filling
      in Saved to disk - a canvas.md claiming frames nobody can see is worse than
      no canvas.md. Only library work done through the MCP, on the document a
      person has open, needs `just pen-save`.

      The `.pen` is 1.5 MB of pretty-printed JSON. It is not encrypted - the
      pencil MCP's own blurb says otherwise and is wrong, and `bin/pen-import`
      has always relied on it being JSON. It diffs, but a three-thousand-node
      diff buries a one-line change, so this document is the review artifact for
      intent and `library-manifest.tsv` is the one for damage. Frame IDs, surface decisions and contracts belong here in full.
    requires:
      - specs

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      Before writing tasks, check design.md for Open Questions. If any of them
      would change what gets built, resolve them with the user first - do not
      bake an unstated assumption into the task list.

      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be tracked.

      Guidelines:
      - Group related tasks under ## numbered headings
      - Each task MUST be a checkbox: `- [ ] X.Y Task description`
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency (what must be done first?)
      - Each task MUST state how to verify completion (a test, command,
        observable behavior, or delivered artifact). Put the verification in
        that task's checkbox description. Use a separate verification task only
        when it checks broader integration or system behavior that spans
        multiple implementation tasks.

      Example:
      ```
      ## 1. Setup

      - [ ] 1.1 Create new module structure and verify expected files are present
      - [ ] 1.2 Add dependencies to package.json and verify package installation succeeds

      ## 2. Core Implementation

      - [ ] 2.1 Implement data export function and verify the export test passes
      - [ ] 2.2 Add CSV formatting utilities and verify unit tests cover quoting and delimiters
      ```

      Reference specs for what needs to be built, design for how to build it,
      and canvas.md for what it looks like.

      UI work splits in a fixed order, and the order is the dependency:

      1. Every entry under canvas.md's Components missing becomes a component
         task in `packages/ui` - the origin in `product-ui.lib.pen` and the
         Svelte component in `packages/ui/src` are one task, not two. A control
         that reproduces another's chrome is a preset wrapping an instance, not
         a new component.
      2. The screen composes instances of those components. It cannot be built
         before they exist, so it never shares a task with them.
      3. Nothing hand-edits `packages/ui/src/tokens.css` - it is generated from
         `design/tokens.json` by `just gen`. A new token means exporting the
         library again, in the same commit.

      Verification is `just check <dir>` for the package the task touched.
      `just check packages/ui` covers the token contract and refuses a raw hex
      outside tokens.css.
    requires:
      - specs
      - design
      - canvas

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    Pause if you hit blockers or need clarification.
