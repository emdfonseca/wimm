#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

rules:
  canvas:
    - Journey flow goes in a journey .pen that imports the library; product-ui.lib.pen holds reusable mechanics only.
    - Address the library through its alias: ref "ui:<id>", tokens "$ui:<name>". A bare id does not resolve.
    - Record the frame IDs. The .pen does not diff, so canvas.md is the only thing a reviewer can read.
    - Draw with `just pen-exec`; the pencil MCP ignores its filePath and edits whatever Pen.app has open.
  tasks:
    - A missing component is built in packages/ui before the screen that uses it, never in the same task.
    - Every task verifies with `just check <dir>` or a named observable result.

operations:
  apply:
    guidance:
      - Build library components before the screen that instances them.
      - tokens.css is generated. Change design/tokens.json and run `just gen`; never edit the output.
      - A canvas frame is intent, not behaviour. Focus order, announcements and routing are written in code and verified there.
  archive:
    guidance:
      - Confirm the journey .pen is saved and committed before archiving a change whose canvas.md names frames.
