schema: wimm

context: |
  wimm is a personal-finance ledger. Go services under apps/, importable Go
  packages under packages/. The UI is SvelteKit with Svelte 5 in packages/ui.
  Python only where a library forces it.

  Three API surfaces and no fourth (ADR 0001). Connect over protobuf runs server
  to server between our own services. Our own web client speaks REST over HTTP
  and JSON through the app's own SvelteKit server routes, never Connect, and
  that surface is undocumented and unversioned because its only consumer ships
  in the same deploy. Third parties and webhooks get REST with OpenAPI 3.1 and
  RFC 9457 errors.

  Postgres with goose migrations, owned by the service that owns the database.
  Every lifetime is compared against database time, never a process clock.
  OpenTelemetry over OTLP for traces, metrics and logs; services never know
  which backend receives them.

  devbox owns the toolchain and just owns every task entry point. `just check
  <dir>` is the only test, lint and typecheck command — if it fails, the work is
  not done. CI runs `devbox run -- just ci` and nothing else. Files under gen/
  are regenerated with `just gen`, never hand-edited.

  Decisions already made live in docs/decisions/NNNN-title.md and are indexed in
  .claude/rules/decisions.md. Read them before proposing something they already
  settle. A proposal and an ADR are different artifacts: the proposal says what
  is about to be built, the ADR records what was chosen and why. A change that
  adds a dependency, a service, a public contract or a schema needs an ADR in
  the same commit as the code.

  Repo standards are Claude skills in .claude/skills/; language conventions are
  in .claude/rules/. Both are binding on generated work.

  Code is the design of record (ADR 0023). A screen's design is its
  presentational Svelte component under packages/ui/src/pages and that
  component's state stories, seen on the design canvas with `just canvas`.
  There is no drawing of a screen and nothing to keep in step with one.
  canvas.md is a state plan: the state stories a change will write, the words
  each shows, and what was seen when they were looked at. design/tokens.json is
  the source of token values.

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

operations:
  apply:
    guidance:
      - Build components before the screen that uses them, the presentational screen and its state stories before the look task, and the look task before any wiring.
      - tokens.css is generated. Change design/tokens.json and run `just gen`; never edit the output.
      - A state story shows a state on fixtures; it does not prove behaviour by being looked at. Focus order, announcements and routing are asserted in play functions.
      - The look task writes what was seen at compact, medium, wide and ultra into canvas.md under Seen. Never fill Seen in from memory.
  archive:
    guidance:
      - Confirm canvas.md's Seen section names every state story at every regime before archiving a change that has a state plan.
