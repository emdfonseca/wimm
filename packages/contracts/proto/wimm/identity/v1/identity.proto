syntax = "proto3";

package wimm.identity.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// A person registered to use this instance. "Member" throughout: never User,
// never Account.
message Member {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
}

// An enrolment link the operator passes on. The value is a bearer credential:
// whoever holds it becomes that member, so it is returned once, to the
// operator, and never read back from storage.
message EnrolmentLink {
  // Absolute URL, including the link value in its path.
  string url = 1;
  // When the link stops working, so the operator can say so when they send it.
  google.protobuf.Timestamp expires_at = 2;
}

// Why an enrolment link cannot be used. Expired, spent, replaced and
// never-issued are one value on purpose: the response must not reveal which,
// and a distinct enum member would be that distinction waiting to leak.
enum EnrolmentLinkRejection {
  ENROLMENT_LINK_REJECTION_UNSPECIFIED = 0;
  ENROLMENT_LINK_REJECTION_UNUSABLE = 1;
}

// Why an enrolment attempt did not produce a passkey.
enum EnrolmentFailure {
  ENROLMENT_FAILURE_UNSPECIFIED = 0;
  // The authenticator did not create a credential the member can sign in with
  // without typing an identifier.
  ENROLMENT_FAILURE_NOT_DISCOVERABLE = 1;
  // The member closed or cancelled the browser's prompt.
  ENROLMENT_FAILURE_DISMISSED = 2;
}

// An email address as the operator asserts it. Nothing verifies that it
// belongs to the person named.
message EmailAddress {
  string value = 1 [(buf.validate.field).string.email = true];
}
