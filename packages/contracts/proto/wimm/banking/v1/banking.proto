syntax = "proto3";

package wimm.banking.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// Connecting a bank, choosing who sees each account, and reading balances.
//
// No gateway vocabulary appears anywhere in this file. "Connection" is wimm's
// word; Enable Banking calls it a session and GoCardless a requisition, and the
// browser must not learn which is behind it (ADR 0018). No sealed value appears
// either: what could reach a bank never leaves the server.
service BankingService {
  // Banks connectable in a country, each carrying how long its consent lasts.
  // Deadline: 10s.
  rpc ListBanks(ListBanksRequest) returns (ListBanksResponse);

  // Begin a connection and get somewhere to send the member. Deadline: 10s.
  rpc BeginConnection(BeginConnectionRequest) returns (BeginConnectionResponse);

  // Exchange the member's return for live access. Deadline: 30s — this is the
  // call that talks to the bank and gets every account back at once.
  rpc CompleteConnection(CompleteConnectionRequest) returns (CompleteConnectionResponse);

  // The accounts on one connection, for choosing who sees them. Only an owner
  // of at least one of them may call it. Deadline: 5s.
  rpc ListConnectionAccounts(ListConnectionAccountsRequest) returns (ListConnectionAccountsResponse);

  // Set who owns an account. Any owner may. Deadline: 5s.
  rpc SetAccountOwners(SetAccountOwnersRequest) returns (SetAccountOwnersResponse);

  // Set what one member may see of one account. Any owner may. Deadline: 5s.
  rpc SetAccountLevel(SetAccountLevelRequest) returns (SetAccountLevelResponse);

  // Leave an account out, or bring it back. Any owner may. Deadline: 5s.
  rpc SetAccountLeftOut(SetAccountLeftOutRequest) returns (SetAccountLeftOutResponse);

  // Set the household's name for an account, or clear it back to the bank's
  // own name. Any owner may. Deadline: 5s.
  rpc SetAccountName(SetAccountNameRequest) returns (SetAccountNameResponse);

  // Everything the calling member may see, at the level they may see it, with
  // a total per currency. Deadline: 30s — it reads balances from the banks.
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);

  // Read balances again, because the member asked. Deadline: 30s.
  rpc RefreshBalances(RefreshBalancesRequest) returns (RefreshBalancesResponse);

  // Re-enter the hand-off for a connection whose access has run out.
  // Deadline: 10s.
  rpc RestoreConnection(RestoreConnectionRequest) returns (RestoreConnectionResponse);

  // Remove a bank. Deadline: 15s.
  rpc DisconnectBank(DisconnectBankRequest) returns (DisconnectBankResponse);

  // One page of the transactions the calling member may see, newest first.
  // Deadline: 30s — it brings the member's accounts up to date first.
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse);

  // Bring the transactions up to date again, because the member asked.
  // Deadline: 30s.
  rpc RefreshTransactions(RefreshTransactionsRequest) returns (RefreshTransactionsResponse);

  // The calling member's balance trend, per currency, walked from their owned
  // accounts' booked transactions. Reads no bank. Deadline: 10s.
  rpc GetBalanceTrend(GetBalanceTrendRequest) returns (GetBalanceTrendResponse);

  // The calling member's month so far per currency, set against the same days
  // of last month, with where the most money went. Drawn from their owned
  // accounts' booked transactions. Reads no bank. Deadline: 10s.
  rpc GetMonthSummary(GetMonthSummaryRequest) returns (GetMonthSummaryResponse);

  // The calling member's months, one per calendar month for up to a year, with
  // the merchants behind each rise, the unusual payments in each, and the
  // payments that recur. Drawn from their owned accounts' booked transactions
  // within the scope asked for. Reads no bank. Deadline: 10s.
  rpc GetMonthHistory(GetMonthHistoryRequest) returns (GetMonthHistoryResponse);
}

// Which of the calling member's owned accounts the insights count. Never
// widens to an account the member holds only a grant on (ADR 0021).
enum InsightScope {
  // Read as ALL.
  INSIGHT_SCOPE_UNSPECIFIED = 0;
  // Owned accounts in the household group (ADR 0024).
  INSIGHT_SCOPE_HOUSEHOLD = 1;
  // Owned accounts in the member's own group.
  INSIGHT_SCOPE_OWN = 2;
  // Every owned account.
  INSIGHT_SCOPE_ALL = 3;
}

enum Cadence {
  CADENCE_UNSPECIFIED = 0;
  CADENCE_WEEKLY = 1;
  CADENCE_MONTHLY = 2;
  CADENCE_YEARLY = 3;
}

// What one member may see of one account they do not own.
//
// The zero value is UNSPECIFIED because buf requires it, and the server treats
// UNSPECIFIED exactly as HIDDEN — never as "leave unchanged" and never as a
// reason to refuse. That mapping is the point: an unset field, a zero-valued
// struct and a field a client forgot all end in the member seeing nothing, so
// the failure mode is "accidentally hidden" rather than "accidentally visible".
// It is asserted in the handler tests rather than left to a reader.
enum Level {
  LEVEL_UNSPECIFIED = 0;
  // Sees nothing of the account, and is told nothing about its existence.
  LEVEL_HIDDEN = 1;
  // The bank, the account's name, and its balance with the time it was read.
  LEVEL_BALANCE = 2;
  // Everything LEVEL_BALANCE carries, plus enough of the account number to
  // tell two accounts at one bank apart, the account type and the holder name.
  //
  // It is named for what it grants rather than "all", so that it cannot widen
  // silently: transactions get their own level rather than riding on this one
  // (ADR 0019).
  LEVEL_DETAILS = 3;
}

// Where an account's figures come from. An account exists on its own terms;
// being sourced from a bank is a property some accounts have.
enum AccountSource {
  ACCOUNT_SOURCE_UNSPECIFIED = 0;
  ACCOUNT_SOURCE_GATEWAY = 1;
  ACCOUNT_SOURCE_MANUAL = 2;
}

// A signed amount in minor units with its currency. Never a float and never a
// bare number: a number without its currency is the one that eventually gets
// added to another (ADR 0018).
message Money {
  // The amount in the currency's smallest unit — cents for EUR. Signed: an
  // overdraft is negative, and the sign is what carries direction.
  int64 minor = 1;
  // ISO 4217 alphabetic code.
  string currency = 2 [(buf.validate.field).string.len = 3];
}

// A bank that can be connected.
message Bank {
  string id = 1;
  string name = 2;
  // ISO 3166-1 alpha-2.
  string country = 3;
  // May be empty; the UI shows a mark rather than a gap.
  string logo_url = 4;
  // How long this bank's consent lasts. It is the bank's limit and not a wimm
  // policy, which is why the member is shown the resulting date before the
  // hand-off — it is 90 days at some banks and 1 day at others.
  int64 max_consent_seconds = 5;
}

// A member, as another member sees them named.
message Member {
  string id = 1;
  string display_name = 2;
}

// A balance and when it was read. A balance without a read time is not a
// balance in this system.
message Balance {
  Money money = 1;
  google.protobuf.Timestamp read_at = 2;
  // True when the last attempt to read failed and this is the previous
  // reading. The figure stays on screen; it just stops claiming to be current.
  bool stale = 3;
}

// One account, as the calling member may see it.
//
// Fields above the member's level are **absent, not empty**: the server does
// not serialise what the member may not see, so there is no client-side
// redaction step that could be forgotten or bypassed.
message Account {
  string id = 1;
  AccountSource source = 2;

  // The member's own level. LEVEL_DETAILS when they own it.
  Level level = 3;
  // True when the calling member owns this account, which outranks every level.
  bool owned = 4;
  // Who owns it. Shown so a household can see whose account is whose.
  repeated Member owners = 5;

  // Present at LEVEL_BALANCE and above. household_name, where the household has
  // set one, is what a person reads; name is the bank's own and stays
  // available beside it.
  string name = 6;
  string household_name = 12;
  Balance balance = 7;

  // Present only at LEVEL_DETAILS.
  string number_suffix = 8;
  string account_type = 9;
  string holder_name = 10;

  // The bank behind it, absent for an account no gateway sources.
  Connection connection = 11;

  // Set when the account is left out: wimm keeps the record and does not read
  // it (ADR 0022). Reaches only an owner — visibleAccountsQuery returns a
  // left-out account to nobody else — and its balance is absent even for them.
  google.protobuf.Timestamp left_out_at = 13;

  // What the account counts towards for the calling member. Decided in wimmd
  // and never recomputed by a client: a group worked out in two places is two
  // answers waiting to differ.
  AccountGroup group = 14;
}

// What an account counts towards for one member. Household money is the
// accounts every member owns or has *details* on; own is what the member owns
// beyond that; shared is everything else they may see, counted in no figure.
enum AccountGroup {
  ACCOUNT_GROUP_UNSPECIFIED = 0;
  ACCOUNT_GROUP_HOUSEHOLD = 1;
  ACCOUNT_GROUP_OWN = 2;
  ACCOUNT_GROUP_SHARED = 3;
}

// A live or ended connection to one bank.
message Connection {
  string id = 1;
  string bank_id = 2;
  string bank_name = 3;
  string bank_logo_url = 4;
  // Who made it, and who will have to restore it. It confers no authority over
  // who sees what.
  Member connected_by = 5;
  // When access ends. There is no renewal in open banking: restoring is the
  // whole flow again.
  google.protobuf.Timestamp consent_expires_at = 6;
  // False once access has run out, whether at the date above or early. A
  // member experiences both identically.
  bool live = 7;
}

// A total per currency. Mixed currencies are never summed: wimm holds no rates,
// and inventing one would invent the number a household trusts most.
message CurrencyTotal {
  Money total = 1;
  int32 account_count = 2;
}

// Why something a member tried did not work. Routed off the kind alone; no
// gateway status code reaches the browser.
enum Failure {
  FAILURE_UNSPECIFIED = 0;
  FAILURE_BANK_UNAVAILABLE = 1;
  FAILURE_SERVICE_UNAVAILABLE = 2;
  FAILURE_CONSENT_DECLINED = 3;
  FAILURE_CONSENT_EXPIRED = 4;
  FAILURE_NO_ACCOUNTS = 5;
  FAILURE_RATE_LIMITED = 6;
}

// A bank that could not be read, named so the member is told which.
message BankFailure {
  string connection_id = 1;
  string bank_name = 2;
  Failure failure = 3;
  // How long until it can be tried again, where the bank said. Absent means
  // "later" rather than "now": a zero must never render as an instruction.
  int64 retry_after_seconds = 4;
}

message ListBanksRequest {
  string country = 1 [(buf.validate.field).string.len = 2];
}

message ListBanksResponse {
  repeated Bank banks = 1;
}

message BeginConnectionRequest {
  string bank_id = 1 [(buf.validate.field).string.min_len = 1];
}

message BeginConnectionResponse {
  // Where to send the member. The server never puts anything in it that a
  // member could bookmark and replay.
  string handoff_url = 1;
  // When access will end if they consent, so the screen states a real date.
  google.protobuf.Timestamp consent_expires_at = 2;
}

message CompleteConnectionRequest {
  // wimm's own opaque value, returned by the bank. Exchanged server side and
  // never left in an address a member can share.
  string state = 1 [(buf.validate.field).string.min_len = 1];
  // The gateway's authorisation code, where it issues one.
  string code = 2;
  // The gateway's own refusal, where the member declined.
  string error = 3;
}

message CompleteConnectionResponse {
  Connection connection = 1;
  // Every account the bank exposed, all owned by the calling member. They are
  // returned once and cannot be listed again from the bank, which is why they
  // are all stored and all returned here.
  repeated Account accounts = 2;
  // Set on a restore: accounts the bank no longer offers, named so the member
  // is told which went.
  repeated string withdrawn_account_names = 3;
}

message ListConnectionAccountsRequest {
  string connection_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ListConnectionAccountsResponse {
  repeated Account accounts = 1;
  // Every member of the household, so the chooser can offer a level per person
  // without a second call.
  repeated Member members = 2;
  // What each account grants each member. Absent pairs are hidden.
  repeated AccountGrant grants = 3;
}

// One member's level on one account, for the chooser.
message AccountGrant {
  string account_id = 1;
  string member_id = 2;
  Level level = 3;
}

message SetAccountOwnersRequest {
  string account_id = 1 [(buf.validate.field).string.min_len = 1];
  // At least one, always: ownership can never fall to zero (ADR 0022). Leaving
  // an account out is a separate call, for a member who is not an owner.
  repeated string member_ids = 2 [(buf.validate.field).repeated.min_items = 1];
}

message SetAccountOwnersResponse {
  Account account = 1;
}

message SetAccountLevelRequest {
  string account_id = 1 [(buf.validate.field).string.min_len = 1];
  string member_id = 2 [(buf.validate.field).string.min_len = 1];
  // LEVEL_HIDDEN removes the grant, and so does LEVEL_UNSPECIFIED.
  Level level = 3;
}

message SetAccountLevelResponse {
  Account account = 1;
}

message SetAccountNameRequest {
  string account_id = 1 [(buf.validate.field).string.min_len = 1];
  // Empty clears it, reverting the screen to the bank's own name.
  string household_name = 2;
}

message SetAccountNameResponse {
  Account account = 1;
}

message SetAccountLeftOutRequest {
  string account_id = 1 [(buf.validate.field).string.min_len = 1];
  // True to leave it out; false to bring it back.
  bool left_out = 2;
}

message SetAccountLeftOutResponse {
  Account account = 1;
}

message ListAccountsRequest {
  // Skip reading from the banks and return what is stored. The screen a member
  // lands on reads; a background poll of the same screen would not.
  bool skip_read = 1;
}

message ListAccountsResponse {
  reserved 2;
  reserved "totals";

  repeated Account accounts = 1;
  // Household money, one per currency: the accounts every member owns or has
  // *details* on. The same for every member. Absent where there are none,
  // rather than a total of zero.
  repeated CurrencyTotal household_totals = 4;
  // The calling member's own money, one per currency: what they own that is not
  // household money. Absent where there is none.
  repeated CurrencyTotal own_totals = 5;
  // Banks that did not answer. The readings already on screen stay, with their
  // original times; this says which could not be brought up to date.
  repeated BankFailure failures = 3;
}

message RefreshBalancesRequest {}

message RefreshBalancesResponse {
  reserved 2;
  reserved "totals";

  repeated Account accounts = 1;
  repeated CurrencyTotal household_totals = 4;
  repeated CurrencyTotal own_totals = 5;
  repeated BankFailure failures = 3;
}

message RestoreConnectionRequest {
  string connection_id = 1 [(buf.validate.field).string.min_len = 1];
  // Why. The flow is the same either way — back to the bank, no picker, owners
  // and levels carried forward — and the reason is what the screen said before
  // sending them.
  RestoreReason reason = 2;
}

message RestoreConnectionResponse {
  string handoff_url = 1;
  google.protobuf.Timestamp consent_expires_at = 2;
}

message DisconnectBankRequest {
  string connection_id = 1 [(buf.validate.field).string.min_len = 1];
}

message DisconnectBankResponse {}

// Why a connection is being handed back to the bank. The bank and the accounts
// are already known in every case, so the picker is skipped and every account
// keeps the owners and the levels it had.
enum RestoreReason {
  RESTORE_REASON_UNSPECIFIED = 0;
  // Access has run out, at the date the bank set or early. A member
  // experiences both identically.
  RESTORE_REASON_ACCESS_ENDED = 1;
  // The connection is live and its consent covers balances but not
  // transactions. It is working, and it is reading everything it was ever
  // granted — so it is never presented as broken, expired or failing.
  RESTORE_REASON_WIDEN_SCOPE = 2;
}

// Whether the bank has settled a transaction.
enum TransactionStatus {
  TRANSACTION_STATUS_UNSPECIFIED = 0;
  TRANSACTION_STATUS_BOOKED = 1;
  // Money that has moved as far as the member is concerned. Shown alongside
  // settled transactions and marked, never hidden.
  TRANSACTION_STATUS_PENDING = 2;
}

// One entry on one account.
//
// Transactions reach only the owners of the account they are on. A member
// granted a level on an account they do not own receives none of these and no
// count of them (ADR 0021).
message Transaction {
  string id = 1;
  string account_id = 2;
  // The account's name and its bank, carried on the row because the list is
  // every account the member owns and a row has to say which one it came from.
  string account_name = 3;
  string bank_name = 4;

  TransactionStatus status = 5;
  // Signed minor units with its currency. The sign carries direction, so
  // nothing depends on colour alone.
  Money amount = 6;
  // The day it is filed under, which the list orders and groups by.
  google.protobuf.Timestamp booking_date = 7;
  // Who it was with, where the bank named them. Empty where it did not: wimm
  // shows what the bank gave and never invents a name.
  string counterparty_name = 8;
  // The description the bank carried, exactly as the bank wrote it.
  string remittance = 9;
  // The name wimm shows: the merchant or person it was with, with the bank's
  // own bookkeeping removed. Never empty. Derived on read, never stored.
  string display_name = 10;
  // True when the one unusual-payment rule marks this booked row, judged under
  // the All scope. Derived on read, never stored.
  bool unusual = 11;
  // True when this booked row is one half of a movement between two accounts
  // the calling member owns. Set whenever the row is half of any pair, in every
  // scope, and it takes the status slot from unusual. No partner id is sent:
  // the browser cannot show the other row, and an id is one more thing that
  // could point at an account. Derived on read, never stored.
  bool own_transfer = 12;
}

// Where a page starts. It is the sort key itself rather than an offset, because
// a sync inserts at the newest end while a member is reading: with an offset the
// rows under them shift and they silently re-read some and skip others.
//
// It is opaque to the browser. A member is never shown a page number; where they
// are is a span of dates.
message LedgerCursor {
  google.protobuf.Timestamp booking_date = 1;
  string transaction_id = 2;
}

// A bank connected before wimm could read transactions, with the way to widen
// it. It is an inline alert on that bank, never a page banner: a household with
// one narrow bank and two wide ones must not be warned about the whole product.
message NarrowConnection {
  string connection_id = 1;
  string bank_name = 2;
}

message ListTransactionsRequest {
  // Narrow to one account the member owns. Empty is every account they own —
  // the same list filtered, not a different screen.
  string account_id = 1;
  // Where to read from. Absent is the newest page.
  LedgerCursor cursor = 2;
  // Read away from today. False with a cursor reads back towards it.
  bool older = 3;
  // Return what is stored without asking any bank. The page a member paged to
  // uses it: a sync would insert at the newest end while they are reading
  // somewhere else.
  bool skip_sync = 4;
  // Jump to the oldest page, native to a keyset seek the same way the newest
  // page already is. Ignored when cursor or page_start is set.
  bool oldest = 5;
  // Jump to a specific real page, named by the ledger's own page index
  // (never a calendar month — a page can span more of them than one). Read
  // inclusively: this is that page's own newest row. Ignored when cursor is
  // set.
  LedgerCursor page_start = 6;
}

message RefreshTransactionsRequest {
  string account_id = 1;
}

message ListTransactionsResponse {
  Ledger ledger = 1;
}

message RefreshTransactionsResponse {
  Ledger ledger = 1;
}

// One page of the ledger and everything the screen says about it. Both reads
// return the same thing, because a refresh is the same screen re-read rather
// than a different answer.
message Ledger {
  repeated Transaction transactions = 1;
  // The span of dates on this page, which is what the member is told instead of
  // a page number.
  google.protobuf.Timestamp oldest_on_page = 2;
  google.protobuf.Timestamp newest_on_page = 3;
  // Which controls to offer. On the oldest page the screen says there is
  // nothing older rather than greying a control.
  bool has_older = 4;
  bool has_newer = 5;

  // How many transactions this member may see. A count of what they may see and
  // not a page count: it survives paging unchanged.
  int32 total_count = 6;
  // When any of their accounts was last brought up to date. Absent means
  // nothing has ever been read, which the screen states rather than implying
  // with an empty list.
  google.protobuf.Timestamp synced_at = 7;
  // The date the list actually reaches back to. Absent before the first read:
  // no bank says in advance how much history it will hand over, so wimm states
  // what it reached rather than promising a period.
  google.protobuf.Timestamp reaches_back_to = 8;

  // Banks connected before wimm could read transactions.
  repeated NarrowConnection narrow_connections = 9;
  // Banks that did not answer this time. The transactions already on screen
  // stay with their original time.
  repeated BankFailure failures = 10;
  // True when the member owns no account at all, whatever they have been
  // granted on others. A different empty state from an account read and found
  // empty, and the two are never collapsed into one.
  bool owns_no_account = 11;

  // Every real page the ledger holds for this scope, newest first — never a
  // calendar month standing in for one, which a household with sparse
  // transactions can fill with several of them. Never a "filter" — the list
  // is not cut down by choosing one.
  repeated PageMarker pages = 12;
}

// One real, reachable page of the ledger: the cursor that seeks straight to
// it and the span of dates it actually holds — enough for the scrubber to
// name the page, never to filter by it.
message PageMarker {
  LedgerCursor cursor = 1;
  google.protobuf.Timestamp newest = 2;
  google.protobuf.Timestamp oldest = 3;
}

message GetBalanceTrendRequest {
  InsightScope scope = 1;
}

message GetBalanceTrendResponse {
  // One entry per currency the calling member's owned accounts hold, oldest
  // point first. Absent for a currency with no transaction access at all —
  // never an empty or flat line standing in for it.
  repeated CurrencyTrend trends = 1;
  // True when an account contributing to the total was excluded here because
  // its connection was never granted transaction access — `banking/overview`:
  // wimm says the trend does not cover every account rather than drawing a
  // line as if it did.
  bool partial_coverage = 2;
}

// One currency's balance history, derived from booked transactions — the same
// rows `banking/transactions` already stores, never a separate reading kept
// for this purpose.
message CurrencyTrend {
  string currency = 1;
  // One per UTC day, end of day, oldest first, the last being now. At most 90.
  // Empty when short_history is set.
  repeated TrendPoint points = 2;
  // True when no contributing account's ledger reaches back a week, so there is
  // no chart to draw. Distinct from a currency with no transaction access,
  // which gets no entry at all.
  bool short_history = 3;
}

// The household's summed balance, in one currency, on one date.
message TrendPoint {
  google.protobuf.Timestamp date = 1;
  Money balance = 2;
  // The rows that moved this day, largest first: enough to reach 80% of the
  // day's gross movement, at most five.
  repeated DayMover movers = 3;
  // How many booked rows that day are not in movers.
  int32 smaller = 4;
}

// One booked row that moved a day. Signed: money in is positive.
message DayMover {
  string display_name = 1;
  Money amount = 2;
  bool unusual = 3;
  // True when this row is one half of a movement between two accounts the
  // member owns. A mover that is a transfer is never also unusual. The balance
  // line is unaffected: the day's money still moved, so the row is still here.
  bool own_transfer = 4;
}

message GetMonthSummaryRequest {
  InsightScope scope = 1;
}

message GetMonthSummaryResponse {
  // One per currency in which the calling member has a booked transaction this
  // month, the currency with the most money out first. No entry for a quiet
  // currency, and none at all for a member who owns nothing.
  repeated CurrencyMonth months = 1;
}

// One currency's month so far, from the 1st to today.
message CurrencyMonth {
  string currency = 1;
  // Money in and out are both positive; net is in minus out.
  Money in = 2;
  Money out = 3;
  Money net = 4;
  // The same figures for the same days of last month. Unset unless every
  // contributing account's ledger reaches back to the first of last month.
  Money prior_in = 5;
  Money prior_out = 6;
  Money prior_net = 7;
  // Set when a contributing ledger begins after the 1st, so the screen can say
  // which date it counts from rather than passing itself off as the whole
  // month so far.
  google.protobuf.Timestamp counted_from = 8;
  // The first of the month, for the link to Transactions.
  google.protobuf.Timestamp month_start = 9;
  // The five merchants the most money went to, largest first.
  repeated MerchantTotal top_merchants = 10;
  // The five largest single payments, largest first.
  repeated Transaction largest_payments = 11;
}

message GetMonthHistoryRequest {
  InsightScope scope = 1;
}

message GetMonthHistoryResponse {
  // The scope actually answered.
  InsightScope scope = 1;
  // Empty when no scope control is to be shown.
  repeated InsightScope available = 2;
  // Account names, set only when Household is narrower than household money:
  // household accounts the member owns, and household accounts they see but do
  // not own.
  repeated string household_counted = 3;
  repeated string household_not_counted = 4;
  // One per currency with a full month or a recurring payment, or every currency
  // held when a scope control is on offer, the currency
  // with the most money out first.
  repeated CurrencyHistory histories = 5;
}

message CurrencyHistory {
  string currency = 1;
  // Newest first, at most 13.
  repeated HistoryMonth months = 2;
  int32 full_months = 3;
  // Unset under three full months.
  Money typical_net = 4;
  Money average_net = 5;
  // The same, with every unusual payment set aside.
  Money typical_net_usual = 6;
  Money average_net_usual = 7;
  // Across the months shown.
  int32 unusual_count = 8;
  // Soonest expected first.
  repeated RecurringPayment recurring = 9;
  // Accounts missing from at least one full month shown, oldest beginning
  // first: the months before `from` do not include them.
  repeated LateLedger late_ledgers = 10;
}

message LateLedger {
  string account_name = 1;
  google.protobuf.Timestamp from = 2;
}

message HistoryMonth {
  google.protobuf.Timestamp month_start = 1;
  // in and out are positive; net is in minus out.
  Money in = 2;
  Money out = 3;
  Money net = 4;
  // Set only when the month held an unusual payment.
  Money net_usual = 5;
  // The current month.
  bool so_far = 6;
  // Set when a contributing ledger begins inside this month.
  google.protobuf.Timestamp held_from = 7;
  // At most five, largest rise first. Empty for a partial month.
  repeated MerchantRise risers = 8;
  // Newest first.
  repeated UnusualPayment unusual = 9;
  // How many transfers between the member's own accounts this month's figures
  // left out, and what they came to. A pair is counted in the month its money
  // left, so twelve months' counts add up to the number of pairs. Zero and
  // unset where the scope left none out; the total is positive.
  int32 transfers_left_out = 10;
  Money transfers_total = 11;
}

message MerchantRise {
  string name = 1;
  Money total = 2;
  // The merchant's own median month over the full months, zeros included.
  Money usual = 3;
  int32 payments = 4;
}

message UnusualPayment {
  Transaction transaction = 1;
  // What is typical for its baseline. Unset when first_payment is set.
  Money typical = 2;
  // A first payment to a merchant never paid before.
  bool first_payment = 3;
}

message RecurringPayment {
  string name = 1;
  // The newest payment's amount, signed as the row is.
  Money amount = 2;
  Cadence cadence = 3;
  // A yearly payment seen only twice.
  bool likely = 4;
  google.protobuf.Timestamp expected = 5;
  // Expected date passed and still inside the cadence's slack.
  bool late = 6;
  string account_id = 7;
}

// Money out to one merchant this month.
message MerchantTotal {
  string name = 1;
  // Positive.
  Money total = 2;
  int32 payments = 3;
}
